name: Quality & build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm media:vhs:check
      - run: pnpm build
        env:
          SITE_URL: https://example.com
          DEPLOY_TARGET: static
      - name: Check expected routes
        run: pnpm check:site
      - name: Build summary
        run: |
          echo 'Landing page and Starlight docs built successfully.' >> "$GITHUB_STEP_SUMMARY"
