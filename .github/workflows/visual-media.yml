name: Visual media

# Builds the site and captures media only for published releases or manual runs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm build
        env:
          SITE_URL: https://example.com
          DEPLOY_TARGET: static
      - run: pnpm check:site
      - name: Start preview server
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 --strictPort > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/docs/ -o /dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/astro-preview.pid)"; then cat /tmp/astro-preview.log; exit 1; fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1
      - name: Capture website screenshots (Playwright)
        run: pnpm media:capture
      - name: Record and encode website MP4 (Playwright + FFmpeg)
        run: pnpm media:video
      - run: pnpm media:vhs:check
      - name: Capture terminal PNG, GIF, and MP4 (VHS CLI)
        run: node scripts/media/vhs.mjs --docker
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-media-${{ github.run_number }}
          path: media-output/
          retention-days: 30
          if-no-files-found: warn
