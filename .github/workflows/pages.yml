name: Deploy to GitHub Pages

# Deploys only when a release is published or the workflow is run manually.
on:
  release:
    types: [published]
  workflow_dispatch:

# Pages needs to write the deployment and mint an OIDC token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Outputs the site origin and, for a project site, its sub-path
      # (e.g. `/project-website-bootstrap`). The path is empty on a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: pnpm build
        env:
          DEPLOY_TARGET: static
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: pnpm check:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
